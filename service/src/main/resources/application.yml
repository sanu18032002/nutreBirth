spring:
  application:
    name: service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/nutrebirth_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
google:
  client-id: ${GOOGLE_CLIENT_ID:}

jwt:
  secret: ${JWT_SECRET:}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    cookie-name: ${APP_AUTH_COOKIE_NAME:nb_auth}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_RvWi08hpiUWWFU}
  key-secret: ${RAZORPAY_KEY_SECRET:Ayjd4M7emZCvV8m1DPgfsfQm}

logging:
  level:
    com.nutreBirth: DEBUG
    org.springframework.security: DEBUG
